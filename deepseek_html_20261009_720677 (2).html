  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

if (isMobile) document.getElementById('mobile-controls').style.display = 'block';
document.getElementById('hint').style.display = isMobile ? 'none' : 'block';

function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); touch[prop]=true; };
  const off = e => { e.preventDefault(); touch[prop]=false; };
  el.addEventListener('touchstart', on);
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('btn-left','left');
bindBtn('btn-right','right');
bindBtn('btn-jump','jump');
bindBtn('btn-attack','attack');

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') {
    const mc = document.getElementById('mobile-controls');
    mc.style.display = mc.style.display === 'block' ? 'none' : 'block';
  }
});

function isPressed(action){
  const codes = controls[action];
  for (const c of codes){ if (keys[c]) return true; }
  // NUEVO: Si la acción es ataque y el control incluye Mouse0, comprobar click
  if (action === 'attack' && codes.includes('Mouse0') && mouseAttackPressed) return true;
  if (action === 'left' && touch.left) return true;
  if (action === 'right' && touch.right) return true;
  if (action === 'jump' && touch.jump) return true;
  if (action === 'attack' && touch.attack) return true;
  return false;
}

// ---------- Audio ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio(){ if(!actx) actx = new AudioCtx(); }
function beep(freq, dur=0.08, type='square', vol=0.05) {
  if(!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur);
}
function sfxJump(){ beep(440, 0.12, 'square', 0.05); setTimeout(()=>beep(660,0.08,'square',0.04),60);}
function sfxCoin(){ beep(880,0.06,'square',0.05); setTimeout(()=>beep(1320,0.08,'square',0.05),50);}
function sfxHit(){ beep(180,0.08,'sawtooth',0.06); }
function sfxHurt(){ beep(120,0.2,'sawtooth',0.08); }
function sfxAttack(){ beep(300,0.05,'square',0.05); }
function sfxExplode(){ 
  if(!actx) return;
  const buf = actx.createBuffer(1, actx.sampleRate*0.25, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = 0.08;
  src.connect(g); g.connect(actx.destination); src.start();
}

// ---------- Música procedural ----------
let music = {
  playing: false,
  nextNoteTime: 0,
  step: 0,
  tempo: 0.15,
  melody: [0, 3, 7, 10, 7, 3, 0, -2, 0, 3, 7, 12, 10, 7, 3, 0],
  bass: [0, 0, -5, -5, -3, -3, -7, -7, -5, -5, -3, -3, -2, -2, -7, -7],
};
function startMusic(){
  if (!actx || music.playing) return;
  music.playing = true;
  music.nextNoteTime = actx.currentTime;
  music.step = 0;
  scheduleMusic();
}
function stopMusic(){ music.playing = false; }
function noteFreq(semitone, base=220){ return base * Math.pow(2, semitone/12); }
function scheduleMusic(){
  if (!music.playing) return;
  const now = actx.currentTime;
  while (music.nextNoteTime < now + 0.3){
    const step = music.step % music.melody.length;
    const mel = music.melody[step];
    const bass = music.bass[step];
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = noteFreq(mel + 12, 220);
    g.gain.value = 0.015;
    g.gain.setValueAtTime(0.015, music.nextNoteTime);
    g.gain.exponentialRampToValueAtTime(0.001, music.nextNoteTime + music.tempo*1.8);
    o.connect(g); g.connect(actx.destination);
    o.start(music.nextNoteTime);
    o.stop(music.nextNoteTime + music.tempo*2);
    const ob = actx.createOscillator();
    const gb = actx.createGain();
    ob.type = 'sawtooth';
    ob.frequency.value = noteFreq(bass, 110);
    gb.gain.value = 0.02;
    gb.gain.setValueAtTime(0.02, music.nextNoteTime);
    gb.gain.exponentialRampToValueAtTime(0.001, music.nextNoteTime + music.tempo*1.5);
    ob.connect(gb); gb.connect(actx.destination);
    ob.start(music.nextNoteTime);
    ob.stop(music.nextNoteTime + music.tempo*1.8);
    if (step % 4 === 0){
      const ok = actx.createOscillator();
      const gk = actx.createGain();
      ok.type = 'sine';
      ok.frequency.setValueAtTime(80, music.nextNoteTime);
      ok.frequency.exponentialRampToValueAtTime(40, music.nextNoteTime + 0.1);
      gk.gain.value = 0.04;
      gk.gain.exponentialRampToValueAtTime(0.001, music.nextNoteTime + 0.15);
      ok.connect(gk); gk.connect(actx.destination);
      ok.start(music.nextNoteTime);
      ok.stop(music.nextNoteTime + 0.2);
    }
    if (step % 2 === 1){ beep(6000, 0.02, 'square', 0.008); }
    music.nextNoteTime += music.tempo;
    music.step++;
  }
  if (music.playing) setTimeout(scheduleMusic, 100);
}

function checkMissions(){
  for (const m of MISSIONS){
    if (save.missionsCompleted.includes(m.id)) continue;
    let current = 0;
    if (m.type === 'enemies') current = missionProgress.enemies;
    else if (m.type === 'coins') current = missionProgress.coins;
    else if (m.type === 'levels') current = missionProgress.levels;
    else if (m.type === 'bosses') current = missionProgress.bosses;
    else if (m.type === 'score') current = missionProgress.score;
    else if (m.type === 'perfect') current = missionProgress.perfect;
    else if (m.type === 'purchases') current = missionProgress.purchases;
    
    if (current >= m.goal){
      save.missionsCompleted.push(m.id);
      save.totalCoins += m.reward;
      player.coins += m.reward;
      sfxUnlock();
      addNotification('¡MISIÓN COMPLETADA!', m.name + ' (+' + m.reward + ' 🪙)', '#ffd700');
      persistSave();
    }
  }
}

function applyInventoryToPlayer(){
  player.maxHealth = 3 + save.inventory.health;
  player.health = player.maxHealth;
  player.shieldLevel = save.inventory.shield;
  player.shieldActive = save.inventory.shield;
  player.autoReviveLeft = save.inventory.revive;
  player.doubleJumpLeft = save.inventory.doubleJump > 0 ? 1 : 0;
  player.airDashLeft = save.inventory.airDash > 0 ? 1 : 0;
}

function loadLevel(idx){
  L = game.levels[idx]();
  player.x = 80;
  player.y = GROUND_Y - player.h - 10;
  player.vx = 0; player.vy = 0;
  player.dead = false;
  player.deathRot = 0;
  player.invuln = 0;
  applyInventoryToPlayer();
  particles = [];
  texts = [];
  game.camera.x = 0;
  game.shake = 0;
  game.trainTimer = 600;
  game.lastCheckpoint = null;
  game.deathSequence = null;
  game.levelStartTime = game.time;
  game.levelStartHealth = player.health;
  game.levelDamageTaken = 0;
  game.levelStats = { enemiesKilled: 0, coinsCollected: 0 };
}

function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function getSolids(){
  const arr = [];
  if (!L) return arr;
  for (const g of L.ground) arr.push({x:g.x, y:GROUND_Y, w:g.w, h:200, type:'ground'});
  for (const p of L.platforms) arr.push(p);
  return arr;
}

function getMoveSpeed(){ return 3.2 + save.inventory.speed * 0.25; }
function getJumpPower(){ return 14 + save.inventory.jump * 1.2; }
function getAttackDamage(){ return 1 + save.inventory.damage; }
function getCoinValue(){ return 10 * (1 + save.inventory.coinBoost * 0.25); }

function updatePlayer(dt){
  if (player.dead) return;
  
  const left  = isPressed('left');
  const right = isPressed('right');
  const jump  = isPressed('jump');
  const attack= isPressed('attack');

  const SPEED = getMoveSpeed();
  const ACCEL = 0.55;
  const FRICTION = 0.82;

  if (left){ player.vx -= ACCEL; player.facing = -1; }
  else if (right){ player.vx += ACCEL; player.facing = 1; }
  else { player.vx *= FRICTION; if (Math.abs(player.vx) < 0.1) player.vx = 0; }
  player.vx = Math.max(-SPEED, Math.min(SPEED, player.vx));

  if (jump) player.jumpBuffer = 8; else player.jumpBuffer = Math.max(0, player.jumpBuffer-1);
  if (player.coyote > 0) player.coyote--;
  
  if (player.jumpBuffer > 0 && player.coyote > 0){
    player.vy = -getJumpPower();
    player.jumpBuffer = 0; player.coyote = 0;
    player.doubleJumpLeft = save.inventory.doubleJump > 0 ? 1 : 0;
    sfxJump();
    for(let i=0;i<8;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h, vx:(Math.random()-0.5)*4, vy:Math.random()*2, life:20, color:'#fff', size:4});
  }
  else if (player.jumpBuffer > 0 && player.doubleJumpLeft > 0 && !player.onGround){
    player.vy = -getJumpPower() * 0.9;
    player.jumpBuffer = 0;
    player.doubleJumpLeft = 0;
    sfxJump();
    for(let i=0;i<12;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h, vx:(Math.random()-0.5)*6, vy:Math.random()*3, life:25, color:'#5ac8ff', size:5});
  }
  
  if (!jump && player.vy < -4){ player.vy *= 0.85; }

  if (keys['ShiftLeft'] || keys['ShiftRight']){
    if (player.dashCooldown <= 0){
      if (player.onGround && save.inventory.dashUnlock > 0){
        player.vx = player.facing * 12;
        player.dashCooldown = 60;
        player.dashTimer = 12;
        sfxAttack();
        for(let i=0;i<15;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h/2, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*6, life:25, color:'#ffd700', size:5});
      } else if (!player.onGround && player.airDashLeft > 0){
        player.vx = player.facing * 14;
        player.vy = 0;
        player.dashCooldown = 60;
        player.dashTimer = 12;
        player.airDashLeft = 0;
        sfxAttack();
        for(let i=0;i<20;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h/2, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*8, life:30, color:'#5ac8ff', size:6});
      }
    }
  }
  if (player.dashCooldown > 0) player.dashCooldown--;
  if (player.dashTimer > 0) player.dashTimer--;

  if (player.attackCooldown > 0) player.attackCooldown--;
  if (attack && player.attackCooldown === 0){
    player.attackTimer = 12;
    player.attackCooldown = 22;
    sfxAttack();
    const dmg = getAttackDamage();
    const hb = {x: player.facing>0 ? player.x+player.w : player.x-34, y: player.y+10, w:34, h:30};
    for (const e of L.enemies){
      if (!e.alive) continue;
      if (aabb(hb, {x:e.x,y:e.y,w:36,h:36})){
        e.hp -= dmg;
        e.hitFlash = 10;
        sfxHit();
        for(let i=0;i<8;i++) particles.push({x:e.x+18,y:e.y+18,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,color:'#ffcc00',size:5});
        if (e.hp <= 0){
          e.alive=false;
          game.score += 100;
          game.levelStats.enemiesKilled++;
          missionProgress.enemies++;
          save.totalEnemiesKilled++;
          sfxExplode();
          addText(e.x, e.y, '+100', '#ffcc00');
          checkMissions();
        }
      }
    }
    if (L.boss && L.boss.alive && aabb(hb, {x:L.boss.x,y:L.boss.y,w:L.boss.w,h:L.boss.h})){
      L.boss.hp -= dmg;
      L.boss.hitFlash = 10;
      sfxHit();
      for(let i=0;i<12;i++) particles.push({x:L.boss.x+L.boss.w/2,y:L.boss.y+L.boss.h/2,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:25,color:'#ff3366',size:6});
      if (L.boss.hp <= 0){
        L.boss.alive=false;
        game.score+=1000;
        missionProgress.bosses++;
        sfxExplode();
        addText(L.boss.x, L.boss.y, '+1000', '#ff3366');
        checkMissions();
        unlockAchievement('a_boss1');
      }
    }
  }
  if (player.attackTimer > 0) player.attackTimer--;

  player.vy += GRAVITY;
  if (player.vy > 18) player.vy = 18;

  player.x += player.vx;
  for (const s of getSolids()){
    if (aabb(player, s)){
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
      player.vx = 0;
    }
  }

  player.onGround = false;
  player.y += player.vy;
  for (const s of getSolids()){
    if (aabb(player, s)){
      if (player.vy > 0){
        player.y = s.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.coyote = 8;
        player.airDashLeft = save.inventory.airDash > 0 ? 1 : 0;
      } else if (player.vy < 0){
        player.y = s.y + s.h;
        player.vy = 0;
      }
    }
  }

  if (player.x < 0){ player.x = 0; player.vx = 0; }
  if (player.x + player.w > L.width){ player.x = L.width - player.w; player.vx = 0; }
  if (player.y > H+200){ damagePlayer(3); }

  if (player.invuln > 0) player.invuln--;

  if (save.inventory.fireTrail > 0 && Math.abs(player.vx) > 2 && game.time % 4 === 0){
    particles.push({
      x: player.x + player.w/2 + (Math.random()-0.5)*10,
      y: player.y + player.h - 4,
      vx: (Math.random()-0.5)*1,
      vy: -0.5 - Math.random(),
      life: 25,
      color: `hsl(${25 + save.inventory.fireTrail*10}, 100%, 55%)`,
      size: 5 + save.inventory.fireTrail
    });
  }

  if (save.inventory.regen > 0 && game.time % (600 / save.inventory.regen) === 0 && player.health < player.maxHealth){
    player.health += 0.5;
    if (player.health > player.maxHealth) player.health = player.maxHealth;
    addText(player.x + player.w/2, player.y - 20, '+❤', '#4aff8a');
  }

  for (const e of L.enemies){
    if (!e.alive) continue;
    if (e.type === 'bat'){
      e.x += e.vx;
      e.y = (e.baseY||GROUND_Y-120) + Math.sin(game.time*0.1 + e.x*0.01)*20;
      if (e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;
    } else if (e.type === 'robot'){
      e.x += e.vx;
      if (e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;
      e.vy = (e.vy||0) + GRAVITY;
      e.y += e.vy;
      for (const s of getSolids()){
        if (aabb({x:e.x,y:e.y,w:36,h:36}, s)){
          if (e.vy > 0){ e.y = s.y - 36; e.vy = 0; }
        }
      }
    } else {
      e.x += e.vx;
      if (e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;
      e.vy = (e.vy||0) + GRAVITY;
      e.y += e.vy;
      for (const s of getSolids()){
        if (aabb({x:e.x,y:e.y,w:36,h:36}, s)){
          if (e.vy > 0){ e.y = s.y - 36; e.vy = 0; }
        }
      }
      if (e.hitFlash) e.hitFlash--;
    }
    if (player.invuln === 0 && aabb(player, {x:e.x,y:e.y,w:36,h:36})){
      damagePlayer(1);
      player.vx = player.x < e.x ? -7 : 7;
      player.vy = -7;
    }
  }

  if (L.boss && L.boss.alive){
    const b = L.boss;
    b.timer++;
    b.x += b.vx;
    if (b.x < 400 || b.x > L.width-500) b.vx *= -1;
    b.jumpTimer++;
    if (b.jumpTimer > 90 && Math.random()<0.02){ b.vy = -14; b.jumpTimer = 0; }
    b.vy = (b.vy||0) + GRAVITY;
    b.y += b.vy;
    if (b.y + b.h > GROUND_Y){ b.y = GROUND_Y - b.h; b.vy = 0; }
    if (b.hitFlash) b.hitFlash--;
    
    const projRate = b.bossType === 'apocalypse' ? 60 : (b.bossType === 'megarobot' ? 90 : 120);
    if (b.timer % projRate === 0){
      const count = b.bossType === 'apocalypse' ? 5 : 3;
      for (let i=0;i<count;i++){
        particles.push({
          x:b.x+b.w/2, y:b.y+b.h/2,
          vx:-4 - i*2, vy:-4 + i*2,
          life:60, color: b.bossType === 'megarobot' ? '#5ac8ff' : '#ff3366',
          size:8, proj:true, damage:true
        });
      }
    }
    
    if (player.invuln === 0 && aabb(player, b)){
      damagePlayer(1);
      player.vx = player.x < b.x ? -9 : 9;
      player.vy = -9;
    }
  }

  for (const p of particles){
    if (p.proj){
      p.x += p.vx; p.y += p.vy; p.vy += 0.2;
      if (player.invuln === 0 && aabb(player, {x:p.x-8,y:p.y-8,w:16,h:16})){
        damagePlayer(1);
        p.life = 0;
      }
    }
  }

  for (const s of L.spikes){
    if (aabb(player, s)) damagePlayer(1);
  }

  for (const c of L.coins){
    if (c.got) continue;
    if (save.inventory.magnet > 0){
      const dx = (player.x+player.w/2) - c.x;
      const dy = (player.y+player.h/2) - c.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const magnetRange = 80 + save.inventory.magnet * 40;
      if (dist < magnetRange && dist > 1){
        const pull = 0.6 + save.inventory.magnet * 0.3;
        c.x += (dx/dist) * pull;
        c.y += (dy/dist) * pull;
      }
    }
    if (aabb(player, {x:c.x-6,y:c.y-6,w:22,h:22})){
      c.got = true;
      player.coins++;
      const val = Math.floor(getCoinValue());
      game.score += val;
      game.levelStats.coinsCollected++;
      missionProgress.coins++;
      save.totalCoinsCollected++;
      sfxCoin();
      for(let i=0;i<5;i++) particles.push({x:c.x+5,y:c.y+5,vx:(Math.random()-0.5)*4,vy:-Math.random()*4,life:20,color:'#ffdd00',size:4});
      addText(c.x, c.y, '+' + val, '#ffdd00');
      checkMissions();
    }
  }

  for (const cp of L.checkpoints){
    if (!cp.active && aabb(player, cp)){
      cp.active = true;
      game.lastCheckpoint = {x: cp.x, y: GROUND_Y - player.h, levelIndex: game.levelIndex};
      sfxCheckpointSound();
      addText(cp.x, cp.y-20, '¡CHECKPOINT!', '#00ff88');
      game.shake = 8;
      for(let i=0;i<30;i++) particles.push({x:cp.x+15,y:cp.y+30,vx:(Math.random()-0.5)*8,vy:-Math.random()*8,life:50,color:'#00ff88',size:6});
    }
  }

  if (aabb(player, L.goal) && (!L.boss || !L.boss.alive)){
    completeLevel();
  }

  if (L.trainSpawner){
    game.trainTimer--;
    if (game.trainTimer <= 0){
      game.trainTimer = 600;
      const side = Math.random() < 0.5 ? 1 : -1;
      L.trains.push({
        x: side > 0 ? player.x - 800 : player.x + 800,
        y: GROUND_Y - 90, w: 400, h: 80,
        speed: side > 0 ? 7 : -7,
        active: true, hitPlayer: false,
      });
      addText(player.x, player.y - 40, '¡TREN!', '#ff2222');
      beep(180, 0.4, 'sawtooth', 0.1);
    }
  }

  for (let i = L.trains.length - 1; i >= 0; i--){
    const t = L.trains[i];
    t.x += t.speed;
    if (t.x > player.x + 900 || t.x + t.w < player.x - 900){
      L.trains.splice(i, 1);
      continue;
    }
    if (!t.hitPlayer && aabb(player, {x:t.x, y:t.y, w:t.w, h:t.h})){
      damagePlayer(1);
      t.hitPlayer = true;
      player.vx = t.speed > 0 ? 14 : -14;
      player.vy = -10;
      game.shake = 15;
    }
  }

  player.anim += Math.abs(player.vx) * 0.1;
  player.walkPhase += Math.abs(player.vx) * 0.15;

  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    if (!p.proj){ p.x += p.vx; p.y += p.vy; p.vy += 0.3; }
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function damagePlayer(amt){
  if (player.invuln > 0 || player.dead || game.deathSequence) return;
  
  if (player.shieldLevel > 0 && amt > 0){
    if (player.shieldLevel === 1){
      amt = Math.max(0.5, Math.ceil(amt / 2));
    } else if (player.shieldLevel === 2){
      amt = 0.5;
    } else if (player.shieldLevel >= 3){
      amt = amt * 0.5;
      if (amt < 0.5) amt = 0.5;
      for(let i=0;i<10;i++) particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30,color:'#5ac8ff',size:5});
    }
  }
  
  player.health -= amt;
  player.invuln = 90;
  game.shake = 12;
  game.levelDamageTaken += amt;
  sfxHurt();
  for(let i=0;i<12;i++) particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:30,color:'#ff3366',size:6});
  
  if (player.health <= 0){
    player.health = 0;
    if (player.autoReviveLeft > 0){
      player.autoReviveLeft--;
      player.health = player.maxHealth;
      player.invuln = 120;
      game.shake = 20;
      sfxCheckpointSound();
      addText(player.x + player.w/2, player.y - 30, '¡REVIVE!', '#ffd700');
      for(let i=0;i<40;i++) particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:50,color:'#ffd700',size:7});
      return;
    }
    startDeathSequence();
  }
}

function startDeathSequence(){
  player.dead = true;
  player.deathVx = -Math.sign(player.vx || 1) * 3;
  player.deathVy = -8;
  player.deathRot = 0;
  sfxDeath();
  stopMusic();
  save.totalDeaths++;
  persistSave();
  game.deathSequence = {
    t: 0, duration: 150, phase: 'falling', fadeAlpha: 0,
  };
}

function updateDeathSequence(dt){
  if (!game.deathSequence) return;
  const ds = game.deathSequence;
  ds.t += 1;
  if (ds.phase === 'falling'){
    player.deathVy += 0.6;
    player.x += player.deathVx;
    player.y += player.deathVy;
    player.deathRot += 0.15;
    if (player.y > H + 100 || ds.t > 90) ds.phase = 'fadeout';
  } else if (ds.phase === 'fadeout'){
    ds.fadeAlpha = Math.min(1, ds.fadeAlpha + 0.03);
    if (ds.fadeAlpha >= 1 && ds.t > ds.duration){
      game.state = 'gameover';
      game.menuTime = 0;
      game.deathSequence = null;
      player.dead = false;
    }
  }
}

function addText(x,y,str,color){ texts.push({x,y,str,color,life:60}); }

function completeLevel(){
  save.totalCoins = player.coins;
  save.totalScore += game.score;
  persistSave();
  
  missionProgress.levels++;
  missionProgress.score = Math.max(missionProgress.score, game.score);
  if (game.levelDamageTaken === 0){
    missionProgress.perfect++;
    unlockAchievement('a_perfect');
  }
  checkMissions();
  saveMissionProgress();
  
  let stars = 1;
  if (game.levelDamageTaken === 0) stars = 3;
  else if (player.health > player.maxHealth/2) stars = 2;
  
  const key = 'level_' + game.levelIndex;
  if (!save.starRatings[key] || save.starRatings[key] < stars){
    save.starRatings[key] = stars;
  }
  
  if (game.levelIndex + 1 >= save.unlockedLevels && save.unlockedLevels < game.levels.length){
    save.unlockedLevels = game.levelIndex + 2;
    sfxUnlock();
    addNotification('¡NUEVO NIVEL!', game.levels[game.levelIndex + 1]().name, '#ffd700');
  }
  
  for (const w of WORLDS){
    if (!w.unlocked && save.unlockedLevels > Math.min(...w.levels) + 1){
      w.unlocked = true;
    }
  }
  if (save.unlockedLevels >= 3) unlockAchievement('a_world2');
  if (save.unlockedLevels >= 5) unlockAchievement('a_world3');
  if (save.unlockedLevels >= 8) unlockAchievement('a_world4');
  
  persistSave();
  
  game.levelIndex++;
  if (game.levelIndex >= game.levels.length){
    game.state = 'win';
    game.menuTime = 0;
    stopMusic();
    unlockAchievement('a_win');
    return;
  }
  
  const nextName = game.levels[game.levelIndex]().name;
  game.transition = { active:true, t:0, text: nextName };
  setTimeout(()=>{
    loadLevel(game.levelIndex);
    game.transition.active = false;
    game.state = 'playing';
  }, 1800);
  game.state = 'levelup';
}

// ---------- Fondo ciudad ----------
let cityLayers = null;
function generateCity(){
  cityLayers = [
    { speed: 0.15, buildings: [], color: '#0a0510', windows: false, fire: false },
    { speed: 0.35, buildings: [], color: '#1a0a15', windows: true, fire: true },
    { speed: 0.6,  buildings: [], color: '#2a0f1a', windows: true, fire: true },
  ];
  for (let layer = 0; layer < cityLayers.length; layer++){
    const data = cityLayers[layer];
    let x = 0;
    while (x < 2000){
      const w = 40 + Math.random()*80;
      const h = 100 + Math.random()*250 + layer*30;
      const hasFire = data.fire && Math.random() < 0.4;
      const broken = Math.random() < 0.5;
      data.buildings.push({
        x, w, h, hasFire, broken,
        fires: hasFire ? Array.from({length: 1+Math.floor(Math.random()*3)}, ()=>({
          x: Math.random(), phase: Math.random()*Math.PI*2, size: 8 + Math.random()*15
        })) : []
      });
      x += w + 5 + Math.random()*20;
    }
  }
}
generateCity();

function drawCityBackground(){
  const camX = game.camera.x;
  const skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0, '#1a0010');
  skyGrad.addColorStop(0.4, '#4a0a15');
  skyGrad.addColorStop(0.7, '#8a1a0a');
  skyGrad.addColorStop(1, '#2a0505');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);
  
  ctx.save();
  ctx.globalAlpha = 0.85;
  const moonX = W*0.75 - camX*0.05;
  const moonY = 100;
  const moonGrad = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, 80);
  moonGrad.addColorStop(0, '#ff5a2a');
  moonGrad.addColorStop(0.5, 'rgba(255,80,40,0.4)');
  moonGrad.addColorStop(1, 'rgba(255,80,40,0)');
  ctx.fillStyle = moonGrad;
  ctx.fillRect(moonX-100, moonY-100, 200, 200);
  ctx.fillStyle = '#ff8844';
  ctx.beginPath();
  ctx.arc(moonX, moonY, 30, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  
  ctx.save();
  ctx.globalAlpha = 0.3;
  for (let i=0;i<6;i++){
    const cx = ((i*350 + game.time*0.2) % (W+400)) - 200 - camX*0.1;
    const cy = 80 + (i*37)%100;
    ctx.fillStyle = '#1a0a15';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 120, 40, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  
  for (let layer = 0; layer < cityLayers.length; layer++){
    const data = cityLayers[layer];
    const layerX = -camX * data.speed;
    const alpha = 1 - layer*0.15;
    ctx.globalAlpha = alpha;
    
    for (const b of data.buildings){
      let bx = b.x + layerX;
      bx = ((bx % 2000) + 2000) % 2000 - 200;
      if (bx > W+200 || bx + b.w < -200) continue;
      const by = H - 100 - b.h;
      ctx.fillStyle = data.color;
      ctx.fillRect(bx, by, b.w, b.h + 100);
      if (b.broken){
        ctx.fillStyle = skyGrad;
        const spikes = 4 + Math.floor(Math.random()*3);
        for (let s=0;s<spikes;s++){
          const sx = bx + (s/spikes)*b.w;
          const sh = 10 + Math.random()*20;
          ctx.fillRect(sx, by-sh, b.w/spikes*0.7, sh);
        }
      }
      if (data.windows && b.w > 30){
        for (let wy = by+15; wy < by+b.h-15; wy += 22){
          for (let wx = bx+8; wx < bx+b.w-10; wx += 18){
            const seed = (wx*7 + wy*13 + layer*31) % 100;
            if (seed < 30){
              ctx.fillStyle = `rgba(255,120,30,${0.4 + Math.sin(game.time*0.05 + wx)*0.2})`;
              ctx.fillRect(wx, wy, 10, 14);
            } else if (seed < 40){
              ctx.fillStyle = 'rgba(0,0,0,0.6)';
              ctx.fillRect(wx, wy, 10, 14);
            }
          }
        }
      }
      if (b.hasFire){
        for (const f of b.fires){
          const fx = bx + f.x * b.w;
          const fy = by + 5;
          for (let k=0;k<3;k++){
            const t = game.time*0.15 + f.phase + k;
            const flameY = fy - Math.abs(Math.sin(t))*15 - k*3;
            const flameW = f.size * (1 - k*0.2);
            const flameH = f.size * (1.5 - k*0.3);
            const hue = 20 + k*15 + Math.sin(t)*10;
            ctx.fillStyle = `hsla(${hue}, 100%, ${55 - k*10}%, ${0.8 - k*0.2})`;
            ctx.beginPath();
            ctx.ellipse(fx, flameY, flameW, flameH, 0, 0, Math.PI*2);
            ctx.fill();
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
  
  for (const e of bgEmbers){
    e.x += e.vx + Math.sin(game.time*0.02 + e.life)*0.2;
    e.y += e.vy;
    e.life--;
    if (e.y < -20 || e.life <= 0){
      e.x = Math.random()*W;
      e.y = H + 20;
      e.life = e.maxLife;
      e.size = 1 + Math.random()*3;
    }
    const alpha = Math.min(1, e.life / 100);
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = `hsl(${e.hue}, 100%, 60%)`;
    ctx.fillRect(e.x, e.y, e.size, e.size);
  }
  ctx.globalAlpha = 1;
  
  const fogGrad = ctx.createLinearGradient(0, H-200, 0, H);
  fogGrad.addColorStop(0, 'rgba(80,10,10,0)');
  fogGrad.addColorStop(1, 'rgba(120,20,10,0.6)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H-200, W, 200);
}

function drawDudge(x, y, facing, walkPhase, isAttacking, isHurt, rot){
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (facing < 0) ctx.scale(-1, 1);
  if (isHurt && Math.floor(game.time) % 4 < 2) ctx.globalAlpha = 0.5;
  
  const bob = Math.sin(walkPhase) * 1.5;
  const legSwing = Math.sin(walkPhase) * 8;
  const armSwing = Math.sin(walkPhase) * 6;
  
  ctx.fillStyle = '#5a4a2a';
  ctx.fillRect(-11, 8 + Math.max(0, legSwing)*0.5, 8, 20);
  ctx.fillRect(3, 8 + Math.max(0, -legSwing)*0.5, 8, 20);
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-11, 26 + Math.max(0, legSwing)*0.5, 8, 4);
  ctx.fillRect(3, 26 + Math.max(0, -legSwing)*0.5, 8, 4);
  
  ctx.fillStyle = '#6a5a3a';
  ctx.fillRect(-14, -12 + bob, 28, 24);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-14, -12 + bob, 6, 24);
  
  ctx.fillStyle = '#5a4a2a';
  ctx.fillRect(-20, -10 + bob + armSwing, 7, 18);
  ctx.fillRect(13, -10 + bob - armSwing, 7, 18);
  
  ctx.save();
  const swordBaseX = 18, swordBaseY = -4 + bob - armSwing;
  if (isAttacking){
    const attackProgress = 1 - (player.attackTimer / 12);
    ctx.translate(swordBaseX, swordBaseY);
    ctx.rotate(-0.8 + attackProgress * 1.6);
    ctx.fillStyle = '#d4a878';
    ctx.fillRect(0, -3, 28, 6);
  } else {
    ctx.fillStyle = '#d4a878';
    ctx.fillRect(swordBaseX, swordBaseY, 6, 32);
  }
  ctx.restore();
  
  ctx.fillStyle = '#f0f0e8';
  ctx.fillRect(-17, -40 + bob, 34, 30);
  ctx.strokeStyle = '#c0c0b8';
  ctx.lineWidth = 1;
  ctx.strokeRect(-17, -40 + bob, 34, 30);
  
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-11, -32 + bob, 8, 8);
  ctx.fillRect(3, -32 + bob, 8, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(-10, -31 + bob, 2, 2);
  ctx.fillRect(4, -31 + bob, 2, 2);
  
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-10, -18 + bob, 20, 6);
  ctx.fillStyle = '#f0f0e8';
  for (let i=0;i<6;i++){
    const tx = -9 + i * (20/6);
    ctx.fillRect(tx, -18 + bob, 2, 4);
  }
  ctx.restore();
}

function drawGround(){
  ctx.fillStyle = '#2a1a0a';

  for (let x=0; x<W; x+=40) ctx.fillRect(x, GROUND_Y, 38, 6);

  ctx.fillRect(0, GROUND_Y, W, 4);
  for (let i=0;i<12;i++){

function drawPlatforms(){
  if (!L) return;
  for (const p of L.platforms){
    const sx = p.x - game.camera.x;
    if (sx + p.w < -50 || sx > W+50) continue;
    ctx.fillStyle = p.color || '#7a5c3a';
    ctx.fillRect(sx, p.y, p.w, p.h);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(sx, p.y, p.w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(sx, p.y+p.h-3, p.w, 3);
  }

function drawSpikes(){
  if (!L) return;
  for (const s of L.spikes){
    const sx = s.x - game.camera.x;
    if (sx + s.w < -50 || sx > W+50) continue;
    ctx.fillStyle = '#aaa';
    const n = Math.floor(s.w / 20);
    for (let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*20, s.y+s.h);
      ctx.lineTo(sx+i*20+10, s.y);
      ctx.lineTo(sx+i*20+20, s.y+s.h);
      ctx.closePath();
      ctx.fill();
    }

function drawCoins(){
  if (!L) return;
  for (const c of L.coins){
    if (c.got) continue;
    const sx = c.x - game.camera.x;
    if (sx < -50 || sx > W+50) continue;
    const bob = Math.sin(game.time*0.1 + c.x*0.1)*3;
    ctx.save();
    ctx.translate(sx, c.y+bob);
    const grad = ctx.createRadialGradient(0,0,2,0,0,15);
    grad.addColorStop(0, 'rgba(255,255,150,0.6)');
    grad.addColorStop(1, 'rgba(255,200,50,0)');

    ctx.fillRect(-15,-15,30,30);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0,0,8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(0,0,5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawCheckpoints(){
  if (!L) return;
  for (const cp of L.checkpoints){
    const sx = cp.x - game.camera.x;
    if (sx < -50 || sx > W+50) continue;
    if (cp.active){
      const pulse = 1 + Math.sin(game.time*0.15)*0.15;
      const glow = ctx.createRadialGradient(sx+15, cp.y+30, 5, sx+15, cp.y+30, 70*pulse);
      glow.addColorStop(0, 'rgba(0,255,136,0.7)');
      glow.addColorStop(1, 'rgba(0,255,136,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx-60, cp.y-40, 150, 150);
    }
    ctx.fillStyle = cp.active ? '#00ff88' : '#666';
    ctx.fillRect(sx, cp.y, cp.w, cp.h);
    ctx.fillStyle = cp.active ? '#00ff88' : '#888';
    ctx.beginPath();
    ctx.moveTo(sx+cp.w, cp.y);
    ctx.lineTo(sx+cp.w+25, cp.y+12);
    ctx.lineTo(sx+cp.w, cp.y+24);
    ctx.closePath();
    ctx.fill();
    if (cp.active){
      for (let i=0;i<6;i++){
        const a = game.time*0.05 + i*Math.PI/3;
        const r = 25 + Math.sin(game.time*0.1 + i)*5;
        const px = sx+15 + Math.cos(a)*r;
        const py = cp.y+30 + Math.sin(a)*r;
        ctx.fillStyle = `hsl(${(i*60 + game.time*2)%360}, 100%, 65%)`;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}

function drawGoal(){
  if (!L) return;
  const sx = L.goal.x - game.camera.x;

  const t = game.time * 0.05;

function drawEnemies(){
  if (!L) return;
  for (const e of L.enemies){
    if (!e.alive) continue;
    const sx = e.x - game.camera.x;
    if (sx < -80 || sx > W+80) continue;
    
    ctx.save();
    ctx.translate(sx+18, e.y+18);
    if (e.hitFlash && e.hitFlash % 4 < 2) ctx.globalAlpha = 0.4;
    
    if (e.type === 'slime'){
      const squash = Math.sin(game.time*0.2 + e.x*0.1)*0.1 + 1;
      ctx.scale(squash, 1/squash);
      ctx.fillStyle = '#4aff8a';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 16, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-6,-4,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(6,-4,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(-5,-4,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7,-4,2,0,Math.PI*2); ctx.fill();
    } else if (e.type === 'bat'){
      ctx.fillStyle = '#6a3a6a';
      const flap = Math.sin(game.time*0.4)*8;
      ctx.beginPath(); ctx.ellipse(-15,-5+flap*0.3, 10, 6, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15,-5-flap*0.3, 10, 6, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4a2a4a';
      ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff3366';
      ctx.beginPath(); ctx.arc(-4,-2,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-2,2,0,Math.PI*2); ctx.fill();
    } else if (e.type === 'rat'){
      ctx.fillStyle = '#6a5a3a';
      ctx.beginPath(); ctx.ellipse(0,0,18,12,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(14,-2,8,7,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(16,-4,2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(17,-4,1,0,Math.PI*2); ctx.fill();
    } else if (e.type === 'knight'){
      ctx.fillStyle = '#8a8a9a';
      ctx.fillRect(-14,-18, 28, 32);
      ctx.fillStyle = '#5a5a6a';
      ctx.fillRect(-16,-6, 32, 6);
      ctx.fillStyle = '#3a3a4a';
      ctx.beginPath(); ctx.arc(0,-22, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(-6,-24, 12, 3);
    } else if (e.type === 'neon'){
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ff00ff';
      ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-5,-3,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(5,-3,3,0,Math.PI*2); ctx.fill();
    } else if (e.type === 'robot'){
      ctx.fillStyle = '#5a6a7a';
      ctx.fillRect(-14, -14, 28, 26);
      ctx.fillStyle = '#3a4a5a';
      ctx.fillRect(-16, -20, 32, 8);
      ctx.fillStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 8;
      ctx.fillRect(-8, -10, 6, 6);
      ctx.fillRect(2, -10, 6, 6);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#5a6a7a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(0, -28);
      ctx.stroke();
      ctx.fillStyle = '#ff3366';
      ctx.beginPath();
      ctx.arc(0, -30, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    if (e.hp > 1){
      ctx.fillStyle = '#000';
      ctx.fillRect(sx, e.y-12, 36, 5);
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(sx, e.y-12, 36*(e.hp/(e.maxHp||3)), 5);
    }
  }
}

function drawBoss(){
  if (!L || !L.boss || !L.boss.alive) return;
  const b = L.boss;
  const sx = b.x - game.camera.x;
  ctx.save();
  ctx.translate(sx+b.w/2, b.y+b.h/2);
  if (b.hitFlash && b.hitFlash % 4 < 2) ctx.globalAlpha = 0.5;
  
  if (b.bossType === 'megarobot'){
    ctx.fillStyle = '#4a5a6a';
    ctx.fillRect(-50, -50, 100, 100);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(-55, -60, 110, 15);
    ctx.fillStyle = '#ff3366';
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 20;
    ctx.fillRect(-30, -25, 20, 20);
    ctx.fillRect(10, -25, 20, 20);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#4a5a6a';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, -60);
    ctx.lineTo(0, -80);

  } else if (b.bossType === 'apocalypse'){
    ctx.fillStyle = '#2a0a1a';
    ctx.beginPath();

    ctx.fill();
    ctx.fillStyle = '#4a0a2a';
    ctx.beginPath();
    ctx.arc(0, -20, 45, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff0044';
    ctx.beginPath();
    ctx.moveTo(-30, -50);
    ctx.lineTo(-45, -90);
    ctx.lineTo(-15, -55);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(30, -50);
    ctx.lineTo(45, -90);
    ctx.lineTo(15, -55);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(-15, -20, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(15, -20, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (b.bossType === 'decaylord'){
    ctx.fillStyle = '#3a1a3a';
    ctx.beginPath();
    ctx.arc(0, 15, 50, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5a2a5a';
    ctx.beginPath();
    ctx.arc(0, -25, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#ff00ff';
    ctx.lineWidth = 5;
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(-35, -55);
    ctx.lineTo(-25, -80);
    ctx.lineTo(-10, -60);
    ctx.lineTo(0, -85);
    ctx.lineTo(10, -60);
    ctx.lineTo(25, -80);
    ctx.lineTo(35, -55);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff00ff';
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(-12, -25, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -25, 6, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.ellipse(0,10, 50, 40, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a4a2a';
    ctx.beginPath(); ctx.arc(0,-20, 30, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-22,-42, 14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(22,-42, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff99bb';
    ctx.beginPath(); ctx.arc(-22,-42, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(22,-42, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(-10,-22, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,-22, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(-20,-48); ctx.lineTo(-15,-62); ctx.lineTo(-8,-50);
    ctx.lineTo(0,-65);   ctx.lineTo(8,-50);
    ctx.lineTo(15,-62);  ctx.lineTo(20,-48);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  
  const barW = 400, barH = 16;
  const bx = (W-barW)/2, by = 20;

  ctx.textAlign = 'center';

  ctx.textAlign = 'left';
}

function drawTrains(){
  if (!L) return;
  for (const t of L.trains){
    const sx = t.x - game.camera.x;
    if (sx + t.w < -100 || sx > W+100) continue;
    if (sx + t.w > -100 && sx < W + 100){
      ctx.fillStyle = `rgba(255,0,0,${0.15 + Math.sin(game.time*0.3)*0.1})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = '#4a3a2a';
    ctx.fillRect(sx, t.y, t.w, t.h);
    ctx.fillStyle = '#6a5a3a';
    ctx.fillRect(sx+5, t.y+5, t.w-10, t.h-15);
    ctx.fillStyle = '#ffcc33';
    for (let i=0;i<4;i++) ctx.fillRect(sx+15+i*90, t.y+15, 60, 30);
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(t.speed > 0 ? sx+t.w-15 : sx+15, t.y+20, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#222';
    for (let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(sx+40+i*100, t.y+t.h, 12, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawPlayer(){
  if (!player.dead && !game.deathSequence){
    const sx = player.x - game.camera.x + player.w/2;
    const sy = player.y + player.h/2 + 6;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(sx, GROUND_Y+2, 20, 4, 0, 0, Math.PI*2);
    ctx.fill();
    drawDudge(sx, sy, player.facing, player.walkPhase, player.attackTimer > 0, player.invuln > 0, 0);
    if (player.attackTimer > 0){
      ctx.save();
      ctx.translate(sx, sy);
      if (player.facing < 0) ctx.scale(-1, 1);
      ctx.strokeStyle = 'rgba(255,215,0,0.7)';
      ctx.lineWidth = 4;
      const p = 1 - player.attackTimer/12;
      ctx.beginPath();
      ctx.arc(0, -5, 35, -0.8 + p*1.6 - 0.6, -0.8 + p*1.6);
      ctx.stroke();
      ctx.restore();
    }
    if (player.shieldLevel > 0){
      ctx.save();
      ctx.translate(sx, sy-5);
      const pulse = 1 + Math.sin(game.time*0.2)*0.05;
      const colors = ['rgba(90,200,255,', 'rgba(90,200,255,', 'rgba(255,200,50,'];
      const c = colors[Math.min(player.shieldLevel-1, 2)];
      ctx.strokeStyle = c + (0.6 + Math.sin(game.time*0.15)*0.2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, (38 + player.shieldLevel*3)*pulse, 0, Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = c + (0.1 + Math.sin(game.time*0.15)*0.05) + ')';
      ctx.fill();
      ctx.restore();
    }
  } else if (player.dead && game.deathSequence){
    const sx = player.x - game.camera.x + player.w/2;
    const sy = player.y + player.h/2 + 6;
    drawDudge(sx, sy, player.facing, 0, false, false, player.deathRot);
  }
}

function drawParticles(){
  for (const p of particles){
    const sx = p.x - game.camera.x;
    const alpha = Math.min(1, p.life / 20);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if (p.proj){
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
    }
    ctx.fillRect(sx - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  for (let i=texts.length-1;i>=0;i--){
    const t = texts[i];
    const sx = t.x - game.camera.x;
    const alpha = Math.min(1, t.life / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 18px Arial Black';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(t.str, sx, t.y - (60 - t.life)*0.5);
    ctx.fillText(t.str, sx, t.y - (60 - t.life)*0.5);
    ctx.textAlign = 'left';
    t.life--;
    if (t.life <= 0) texts.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

  for (let i=0;i<player.maxHealth;i++){
    const x = 20 + i*36, y = 20;

  }
  if (player.shieldLevel > 0){
    ctx.save();

    const colors = ['#5ac8ff', '#5ac8ff', '#ffd700'];

    ctx.fillStyle = c;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0,-10);
    ctx.lineTo(10,-5);
    ctx.lineTo(10,5);
    ctx.lineTo(0,12);
    ctx.lineTo(-10,5);
    ctx.lineTo(-10,-5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial Black';
    ctx.fillText('x' + player.shieldLevel, 14, 6);
    ctx.restore();
  }
  
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(W-140, 30, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath(); ctx.arc(W-140, 30, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial Black';
  ctx.textAlign = 'left';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText('x ' + player.coins, W-115, 38);
  ctx.fillText('x ' + player.coins, W-115, 38);
  ctx.font = 'bold 18px Arial Black';
  ctx.strokeText('PUNTOS: ' + game.score, 20, H-20);
  ctx.fillText('PUNTOS: ' + game.score, 20, H-20);
  if (L){
    ctx.font = 'bold 16px Arial Black';
    ctx.textAlign = 'center';
    ctx.strokeText(L.name, W/2, 30);
    ctx.fillText(L.name, W/2, 30);
    ctx.textAlign = 'left';
  }
  if (L && L.trainSpawner){
    ctx.font = 'bold 14px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2222';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const secs = Math.ceil(game.trainTimer / 60);
    ctx.strokeText('PRÓXIMO TREN: ' + secs + 's', W/2, 55);
    ctx.fillText('PRÓXIMO TREN: ' + secs + 's', W/2, 55);
    ctx.textAlign = 'left';
  }
  
  for (let i = 0; i < notifications.length; i++){
    const n = notifications[i];
    const ny = 90 + i * 50;
    const alpha = Math.min(1, n.life / 60);
    const slide = n.life > n.maxLife - 30 ? (n.maxLife - n.life) / 30 : 1;
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(W - 300*slide, ny);
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, 290, 42);
    ctx.strokeStyle = n.color;
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, 290, 42);
    ctx.fillStyle = n.color;
    ctx.font = 'bold 12px Arial Black';
    ctx.fillText(n.title, 10, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial Black';
    ctx.fillText(n.text, 10, 32);
    ctx.restore();
    ctx.globalAlpha = 1;
    n.life--;
    if (n.life <= 0){ notifications.splice(i, 1); i--; }
  }
}

function drawHeart(x,y,full){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = full >= 1 ? '#ff3366' : (full > 0 ? '#ff3366' : '#333');
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-12, -4, -12, -18, 0, -10);
  ctx.bezierCurveTo(12, -18, 12, -4, 0, 6);
  ctx.fill();
  ctx.stroke();
  if (full > 0 && full < 1){
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(12, -4, 12, -18, 0, -10);
    ctx.lineTo(0, 6);
    ctx.fill();
  }
  ctx.restore();
}

function drawIntro(){
  const t = game.time;
  const g = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W);
  g.addColorStop(0, '#4a1e6d');
  g.addColorStop(1, '#000');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  for (let i=0;i<12;i++){
    ctx.rotate(Math.PI/6 + t*0.005);
    const grad = ctx.createLinearGradient(0,0, 600, 0);
    grad.addColorStop(0, 'rgba(255,107,61,0.6)');
    grad.addColorStop(1, 'rgba(255,107,61,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(600, -40);
    ctx.lineTo(600, 40);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  for (let i=0;i<20;i++){
    const nx = ((i*137 + t*1.5) % (W+100)) - 50;
    const ny = 200 + Math.sin(t*0.05 + i)*100 + (i*17)%200;
    ctx.globalAlpha = 0.5;
    ctx.font = 'bold 24px Arial Black';
    ctx.fillStyle = `hsl(${(i*30 + t)%360}, 100%, 60%)`;
    ctx.fillText(i%2 ? '♪' : '♫', nx, ny);
  }
  ctx.globalAlpha = 1;
  for (let i=0;i<60;i++){
    const a = (i*137 + t*2) % 360;
    const r = 100 + (i*53)%300;
    const x = W/2 + Math.cos(a*Math.PI/180)*r;
    const y = H/2 + Math.sin(a*Math.PI/180)*r;
    ctx.fillStyle = `hsl(${(a+t)%360}, 100%, 60%)`;
    ctx.fillRect(x, y, 4, 4);
  }
  const scale = 1 + Math.sin(t*0.1)*0.05;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.font = 'bold 64px Arial Black';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8;
  ctx.strokeText('IMADGAMER', 0, -20);
  const grad = ctx.createLinearGradient(-300,0,300,0);
  grad.addColorStop(0, '#ff6b3d');
  grad.addColorStop(0.5, '#ffd700');
  grad.addColorStop(1, '#ff3d7a');
  ctx.fillStyle = grad;
  ctx.fillText('IMADGAMER', 0, -20);
  ctx.font = 'bold 32px Arial Black';
  ctx.strokeText('PRESENTA', 0, 40);
  ctx.fillStyle = '#fff';
  ctx.fillText('PRESENTA', 0, 40);
  ctx.restore();
  if (t % 30 < 5){
    ctx.fillStyle = `rgba(255,255,255,${0.3 - (t%30)*0.05})`;
    ctx.fillRect(0,0,W,H);
  }
  if (t > 180) { game.state = 'logo'; game.time = 0; }
}

  ctx.fillStyle = '#ff6b3d';

  const btnStartY = 110;

  for (let i = 0; i < game.menuItems.length; i++){

      ctx.save();
      ctx.translate(btnX + btnW/2, by + btnH/2);
      ctx.scale(pulse, pulse);
      ctx.shadowColor = '#ff6b3d';
      ctx.shadowBlur = 25;
      const bgrad = ctx.createLinearGradient(-btnW/2, 0, btnW/2, 0);

      bgrad.addColorStop(1, 'rgba(255,61,122,0.9)');

      ctx.fillRect(-btnW/2, -btnH/2, btnW, btnH);

      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(-btnW/2, -btnH/2, btnW, btnH);
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();

      ctx.lineWidth = 2;
      ctx.strokeRect(btnX, by, btnW, btnH);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(game.menuItems[i], btnX + btnW/2, by + btnH/2 + 1);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
  }
  ctx.textAlign = 'left';
  
  ctx.font = 'bold 11px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,200,150,0.7)';
  ctx.fillText('↑↓ Navegar · ENTER Seleccionar · I Inventario rápido · M Móvil', W/2, H-20);
  ctx.textAlign = 'left';
}

function drawMissions(){

  ctx.fillStyle = grad;
  ctx.fillText('🎯 MISIONES 🎯', W/2, 50);
  
  const completed = save.missionsCompleted.length;
  ctx.font = 'bold 14px Arial Black';
  ctx.fillStyle = '#fff';
  ctx.fillText('COMPLETADAS: ' + completed + ' / ' + MISSIONS.length, W/2, 75);
  
  const startY = 95;
  const itemH = 32;
  const visible = 12;
  const scroll = Math.max(0, Math.min(MISSIONS.length - visible, game.missionSelection - 5));
  
  for (let i = 0; i < visible; i++){
    const idx = i + scroll;
    if (idx >= MISSIONS.length) break;
    const m = MISSIONS[idx];
    const iy = startY + i * itemH;
    const selected = idx === game.missionSelection;
    const done = save.missionsCompleted.includes(m.id);
    
    let current = 0;
    if (m.type === 'enemies') current = missionProgress.enemies;
    else if (m.type === 'coins') current = missionProgress.coins;
    else if (m.type === 'levels') current = missionProgress.levels;
    else if (m.type === 'bosses') current = missionProgress.bosses;
    else if (m.type === 'score') current = missionProgress.score;
    else if (m.type === 'perfect') current = missionProgress.perfect;
    else if (m.type === 'purchases') current = missionProgress.purchases;
    
    if (done){ ctx.fillStyle = 'rgba(30,80,30,0.85)'; }
    else if (selected){ ctx.fillStyle = 'rgba(80,40,20,0.9)'; }
    else { ctx.fillStyle = 'rgba(20,10,10,0.7)'; }
    ctx.fillRect(W/2-450, iy, 900, itemH-3);
    
    if (selected && !done){
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(W/2-450, iy, 900, itemH-3);
    }
    
    ctx.font = 'bold 16px Arial Black';
    ctx.fillStyle = done ? '#4aff8a' : (selected ? '#ffd700' : '#888');
    ctx.fillText(done ? '✓' : '🎯', W/2-430, iy + 22);
    
    ctx.font = 'bold 13px Arial Black';
    ctx.fillStyle = done ? '#4aff8a' : '#fff';
    ctx.fillText(m.name, W/2-390, iy + 20);
    
    ctx.font = 'bold 11px Arial Black';
    ctx.fillStyle = done ? 'rgba(200,255,200,0.8)' : 'rgba(255,220,180,0.75)';
    ctx.fillText(m.desc, W/2-180, iy + 20);
    
    const pct = Math.min(1, current / m.goal);
    const barX = W/2 + 100;
    const barW = 180;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barX, iy + 10, barW, 12);
    ctx.fillStyle = done ? '#4aff8a' : '#ff6b3d';
    ctx.fillRect(barX, iy + 10, barW * pct, 12);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, iy + 10, barW, 12);
    ctx.font = 'bold 10px Arial Black';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(Math.min(current, m.goal) + '/' + m.goal, barX + barW/2, iy + 20);
    ctx.textAlign = 'left';
    
    ctx.font = 'bold 13px Arial Black';
    ctx.textAlign = 'right';
    ctx.fillStyle = done ? '#888' : '#ffd700';
    ctx.fillText('+' + m.reward + ' 🪙', W/2+440, iy + 20);
    ctx.textAlign = 'left';
  }
  
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px Arial Black';
  ctx.fillStyle = 'rgba(255,200,150,0.8)';
  ctx.fillText('↑↓ navegar  ·  ESPACIO / ESC  volver', W/2, H-15);
  ctx.textAlign = 'left';
}

function drawControlsConfig(){
  const t = game.menuTime;
  game.menuTime += 1;
  drawCityBackground();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0,0,W,H);
  
  ctx.font = 'bold 40px Arial Black';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
  ctx.strokeText('CONTROLES', W/2, 60);
  const grad = ctx.createLinearGradient(-200, 0, 200, 0);
  grad.addColorStop(0, '#ff6b3d');
  grad.addColorStop(1, '#ffd700');
  ctx.fillStyle = grad;
  ctx.fillText('CONTROLES', W/2, 60);
  
  const actions = ['left', 'right', 'jump', 'attack', 'pause', 'inventory'];
  const labels = ['IZQUIERDA', 'DERECHA', 'SALTAR', 'ATACAR', 'PAUSA', 'INVENTARIO'];
  const sel = window._controlSel || 0;
  
  const startY = 110;
  const rowH = 55;
  
  for (let i = 0; i < actions.length; i++){
    const action = actions[i];
    const ay = startY + i * rowH;
    const selected = i === sel;
    const remapping = game.remapAction === action;
    
    ctx.fillStyle = remapping ? 'rgba(255,107,61,0.4)' : (selected ? 'rgba(255,107,61,0.2)' : 'rgba(0,0,0,0.5)');
    ctx.fillRect(W/2-350, ay, 700, rowH-8);
    if (selected){
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.strokeRect(W/2-350, ay, 700, rowH-8);
    }
    
    ctx.font = 'bold 20px Arial Black';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(labels[i], W/2-330, ay + 32);
    
    const keyCodes = controls[action];
    const keyNames = keyCodes.map(k => {
      if (k.startsWith('Key')) return k.slice(3);
      if (k.startsWith('Arrow')) return '←↑→↓'[['Left','Up','Right','Down'].indexOf(k.slice(5))];
      if (k === 'Space') return 'ESPACIO';
      if (k === 'Escape') return 'ESC';
      if (k === 'Tab') return 'TAB';
      if (k === 'Mouse0') return 'CLICK IZQ';
      if (k === 'Mouse1') return 'CLICK DER';
      if (k === 'Mouse2') return 'CLICK MED';
      return k;
    }).join(' / ');
    
    ctx.textAlign = 'right';
    if (remapping){
      const blink = Math.floor(t/15) % 2 === 0;
      ctx.fillStyle = blink ? '#ffd700' : '#fff';
      const hintText = action === 'attack' ? 'TECLA o CLICK...' : 'PRESIONA TECLA...';
      ctx.fillText(hintText, W/2+330, ay + 32);
    } else {
      ctx.fillStyle = '#4aff8a';
      ctx.fillText(keyNames, W/2+330, ay + 32);
    }
    ctx.textAlign = 'left';
  }
  
  ctx.font = 'bold 14px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,200,150,0.8)';
  ctx.fillText('↑ ↓  seleccionar  ·  ENTER  remapear  ·  ESC  volver', W/2, H-30);
  ctx.fillStyle = 'rgba(255,200,150,0.5)';
  ctx.font = 'bold 11px Arial Black';
  ctx.fillText('TIP: en ATACAR puedes usar CLICK IZQUIERDO del ratón', W/2, H-10);
  ctx.textAlign = 'left';
}

  ctx.fillText('CITY OF DECAY: REBORN — RUSH ⚡', W/2, 140);
  ctx.font = 'bold 16px Arial Black';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('UNA PRODUCCIÓN DE', W/2, 200);
  ctx.font = 'bold 30px Arial Black';
  ctx.fillStyle = '#ff6b3d';
  ctx.fillText('IMADGAMER', W/2, 240);
  ctx.font = 'bold 14px Arial Black';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Diseño · Programación · Arte · Música', W/2, 300);
  ctx.fillText('IMADGAMER STUDIOS', W/2, 325);
  ctx.fillStyle = 'rgba(255,200,150,0.7)';
  ctx.font = 'bold 12px Arial Black';
  ctx.fillText('© 2024 IMADGAMER · Todos los derechos reservados', W/2, H-70);
  
  if (Math.floor(t/30) % 2 === 0){
    ctx.font = 'bold 18px Arial Black';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('ESPACIO / ENTER  volver', W/2, H-35);
  }
  ctx.textAlign = 'left';
}

function drawPause(){
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,W,H);
  ctx.font = 'bold 60px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText('PAUSA', W/2, H/2-20);
  ctx.font = 'bold 18px Arial Black';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('P continuar  ·  ESC menú  ·  I inventario', W/2, H/2+40);
  ctx.textAlign = 'left';
}

function drawGameOver(){
  const t = game.menuTime;
  game.menuTime += 1;
  drawCityBackground();
  ctx.fillStyle = `rgba(0,0,0,${Math.min(1, t/60)*0.85})`;
  ctx.fillRect(0,0,W,H);
  
  ctx.font = 'bold 78px Arial Black';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8;
  ctx.strokeText('GAME OVER', W/2, H/2-50);
  const grad = ctx.createLinearGradient(W/2-300,0,W/2+300,0);
  grad.addColorStop(0, '#ff3d7a');
  grad.addColorStop(1, '#ff6b3d');
  ctx.fillStyle = grad;
  ctx.fillText('GAME OVER', W/2, H/2-50);
  
  ctx.font = 'bold 22px Arial Black';
  ctx.fillStyle = '#fff';
  ctx.fillText('PUNTOS: ' + game.score, W/2, H/2);
  ctx.fillText('MONEDAS: ' + player.coins, W/2, H/2+35);
  
  if (game.lastCheckpoint){
    ctx.font = 'bold 18px Arial Black';
    ctx.fillStyle = '#4aff8a';
    ctx.fillText('CHECKPOINT DISPONIBLE', W/2, H/2+75);
  }
  
  if (Math.floor(t/30) % 2 === 0){
    ctx.font = 'bold 20px Arial Black';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('ESPACIO reintentar  ·  ESC menú', W/2, H/2+130);
  }
  ctx.textAlign = 'left';
}

function drawWin(){
  const t = game.menuTime;
  game.menuTime += 1;
  drawCityBackground();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0,0,W,H);
  
  ctx.save();
  ctx.translate(W/2, H/2-80);
  ctx.rotate(t*0.02);
  for (let i=0;i<16;i++){
    ctx.rotate(Math.PI/8);
    ctx.fillStyle = `hsl(${(i*30+t)%360}, 100%, 60%)`;
    ctx.fillRect(0, -8, 400, 16);
  }
  ctx.restore();
  
  ctx.font = 'bold 62px Arial Black';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8;
  ctx.strokeText('¡VICTORIA ÉPICA!', W/2, H/2-60);
  const grad = ctx.createLinearGradient(W/2-300,0,W/2+300,0);
  grad.addColorStop(0, '#ffd700');
  grad.addColorStop(1, '#ff6b3d');
  ctx.fillStyle = grad;
  ctx.fillText('¡VICTORIA ÉPICA!', W/2, H/2-60);
  
  ctx.font = 'bold 20px Arial Black';
  ctx.fillStyle = '#fff';
  ctx.fillText('Has salvado la CITY OF DECAY', W/2, H/2);
  ctx.font = 'bold 26px Arial Black';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('PUNTOS FINALES: ' + game.score, W/2, H/2+45);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial Black';
  ctx.fillText('MONEDAS: ' + player.coins, W/2, H/2+80);
  ctx.fillText('NIVELES COMPLETADOS: ' + game.levels.length, W/2, H/2+110);
  
  for (let i=0;i<5;i++){
    const fx = (i*211 + t*3) % W;
    const fy = 100 + (i*137)%200;
    for (let j=0;j<8;j++){
      const a = j*Math.PI/4 + t*0.05;
      const r = (t*2 + i*20) % 60;
      ctx.fillStyle = `hsl(${(i*72+j*30+t)%360}, 100%, 60%)`;
      ctx.beginPath();
      ctx.arc(fx + Math.cos(a)*r, fy + Math.sin(a)*r, 4, 0, Math.PI*2);
      ctx.fill();
    }
  }
  
  if (Math.floor(t/30) % 2 === 0){
    ctx.font = 'bold 20px Arial Black';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('ESPACIO volver al menú', W/2, H-40);
  }
  ctx.textAlign = 'left';
}

function drawTransition(){
  if (!game.transition.active) return;
  const t = game.transition.t / 1800;
  ctx.fillStyle = `rgba(0,0,0,${Math.min(1, t*2)})`;
  ctx.fillRect(0,0,W,H);
  ctx.font = 'bold 36px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#ff6b3d'; ctx.lineWidth = 6;
  ctx.strokeText(game.transition.text, W/2, H/2);
  ctx.fillText(game.transition.text, W/2, H/2);
  ctx.textAlign = 'left';
}

function drawDeathOverlay(){
  if (!game.deathSequence) return;
  const ds = game.deathSequence;
  if (ds.phase === 'fadeout'){
    ctx.fillStyle = `rgba(0,0,0,${ds.fadeAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

let lastTime = performance.now();
function loop(now){
  const dt = Math.min(50, now - lastTime) / 16.67;
  lastTime = now;
  
  const menuStates = ['menu', 'howto', 'credits', 'shop', 'inventory', 'missions', 'levels', 'controls'];
  if (!menuStates.includes(game.state)){
    game.time += dt;
  }
  
  if (game.state === 'playing'){
    if (game.deathSequence){
      updateDeathSequence(dt);
    } else {
      updatePlayer(dt);
      const targetX = player.x + player.w/2 - W/2;
      game.camera.x += (targetX - game.camera.x) * 0.15;
      if (game.camera.x < 0) game.camera.x = 0;
      if (L && game.camera.x > L.width - W) game.camera.x = L.width - W;
    }
  }
  
  if (game.state === 'levelup' && game.transition.active){
    game.transition.t += 16;
  }
  
  ctx.save();
  if (game.shake > 0){
    ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
    game.shake *= 0.9;
    if (game.shake < 0.5) game.shake = 0;
  }
  
  if (game.state === 'intro') drawIntro();
  else if (game.state === 'logo') drawLogo();
  else if (game.state === 'menu') drawMenu();
  else if (game.state === 'inventory') drawInventory();
  else if (game.state === 'shop') drawShop();
  else if (game.state === 'missions') drawMissions();
  else if (game.state === 'levels') drawLevels();
  else if (game.state === 'controls') drawControlsConfig();
  else if (game.state === 'howto') drawHowTo();
  else if (game.state === 'credits') drawCredits();
  else if (game.state === 'playing' || game.state === 'paused' || game.state === 'levelup'){
    if (L){
      drawCityBackground();
      drawTrains();
      drawGround();
      drawPlatforms();
      drawSpikes();
      drawCoins();
      drawCheckpoints();
      drawGoal();
      drawEnemies();
      drawBoss();
      drawPlayer();
      drawParticles();
      drawTexts();
      drawHUD();
      drawDeathOverlay();
    }
    if (game.state === 'paused') drawPause();
    if (game.state === 'levelup') drawTransition();
  } else if (game.state === 'gameover') drawGameOver();
  else if (game.state === 'win') drawWin();
  
  ctx.restore();
  requestAnimationFrame(loop);
}

function startGame(){
  game.levelIndex = 0;
  game.score = 0;
  resetInventoryToSave();
  loadLevel(0);
  game.state = 'playing';
  game.time = 0;
  if (actx && !music.playing) startMusic();
}

function startLevel(idx){
  game.levelIndex = idx;
  game.score = 0;
  resetInventoryToSave();
  loadLevel(idx);
  game.state = 'playing';
  game.time = 0;
  if (actx && !music.playing) startMusic();
}

function resetInventoryToSave(){
  player.maxHealth = 3 + save.inventory.health;
  player.health = player.maxHealth;
  player.shieldLevel = save.inventory.shield;
  player.shieldActive = save.inventory.shield;
  player.autoReviveLeft = save.inventory.revive;
}

function continueFromCheckpoint(){
  if (game.lastCheckpoint){
    loadLevel(game.lastCheckpoint.levelIndex);
    player.x = game.lastCheckpoint.x;
    player.y = game.lastCheckpoint.y;
    game.state = 'playing';
    game.time = 0;
    if (actx && !music.playing) startMusic();
  } else {
    startGame();
  }
}

function menuSelect(){
  sfxMenuSelect();
  if (game.menuSelection === 0){
    startGame();
  } else if (game.menuSelection === 1){
    game.state = 'inventory';
    game.menuTime = 0;
    game.inventorySelection = 0;
  } else if (game.menuSelection === 2){
    game.state = 'shop';
    game.menuTime = 0;
    game.shopSelection = 0;
  } else if (game.menuSelection === 3){
    game.state = 'missions';
    game.menuTime = 0;
    game.missionSelection = 0;
  } else if (game.menuSelection === 4){
    game.state = 'levels';
    game.menuTime = 0;
    game.levelSelection = 0;
  } else if (game.menuSelection === 5){
    game.state = 'controls';
    game.menuTime = 0;
    game.remapAction = null;
    window._controlSel = 0;
  } else if (game.menuSelection === 6){
    game.state = 'howto';
    game.menuTime = 0;
  } else if (game.menuSelection === 7){
    game.state = 'credits';
    game.menuTime = 0;
  }
}

function menuNavigate(dir){
  sfxMenuHover();
  game.menuSelection = (game.menuSelection + dir + game.menuItems.length) % game.menuItems.length;
}

function buyShopItem(){
  const item = game.shopItems[game.shopSelection];
  if (!item) return;
  const current = item.current();
  if (current >= item.max){
    game.shopMessage = { text: '¡NIVEL MÁXIMO!', color: '#ffaa00', t: 60 };
    beep(180, 0.2, 'sawtooth', 0.06);
    return;
  }
  if (player.coins < item.price){
    game.shopMessage = { text: '¡MONEDAS INSUFICIENTES!', color: '#ff2222', t: 60 };
    beep(180, 0.2, 'sawtooth', 0.06);
    return;
  }
  player.coins -= item.price;
  item.buy();
  save.totalCoins = player.coins;
  missionProgress.purchases++;
  sfxBuy();
  game.shopMessage = { text: '¡COMPRADO: ' + item.name + '!', color: '#4aff8a', t: 80 };
  
  const allTypesBought = ['health','shield','speed','jump','damage','revive','magnet'].every(k => save.inventory[k] > 0);
  if (allTypesBought) unlockAchievement('a_all_shop');
  
  checkMissions();
  persistSave();
  saveMissionProgress();
  
  player.maxHealth = 3 + save.inventory.health;
  if (player.health > player.maxHealth) player.health = player.maxHealth;
  player.shieldLevel = save.inventory.shield;
  player.autoReviveLeft = save.inventory.revive;
}

// NUEVO: Listener para click del ratón como ataque
canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (e.button === 0){
    // Si el control de ataque incluye Mouse0, marcar como presionado
    if (controls.attack.includes('Mouse0')){
      mouseAttackPressed = true;
    }
  }
});
canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0){
    mouseAttackPressed = false;
  }
});
canvas.addEventListener('mouseleave', () => {
  mouseAttackPressed = false;
});
// Deshabilitar menú contextual en click derecho para evitar interferencias
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', e => {
  initAudio();
  
  if (game.state === 'controls' && game.remapAction){
    if (e.code === 'Escape'){ game.remapAction = null; return; }
    controls[game.remapAction] = [e.code];
    saveControls();
    game.remapAction = null;
    sfxCheckpointSound();
    return;
  }
  
  if (game.state === 'intro'){
    if (e.code === 'Space' || e.code === 'Enter'){ 
      game.state = 'logo'; game.time = 0;
      if (actx && !music.playing) startMusic();
    }
  } else if (game.state === 'logo'){
    if (e.code === 'Space' || e.code === 'Enter'){ 
      game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0;
      if (actx && !music.playing) startMusic();
      unlockAchievement('a_first');
    }
  } else if (game.state === 'menu'){
    if (e.code === 'ArrowUp' || e.code === 'KeyW') menuNavigate(-1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') menuNavigate(1);
    else if (e.code === 'Space' || e.code === 'Enter') menuSelect();
  } else if (game.state === 'inventory'){
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape' || e.code === 'KeyI' || e.code === 'Tab'){
      game.state = 'menu'; game.menuTime = 0; game.menuSelection = 1;
    }
  } else if (game.state === 'shop'){
    if (e.code === 'ArrowUp' || e.code === 'KeyW'){ 
      sfxMenuHover();
      game.shopSelection = (game.shopSelection - 1 + game.shopItems.length) % game.shopItems.length;
    }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS'){ 
      sfxMenuHover();
      game.shopSelection = (game.shopSelection + 1) % game.shopItems.length;
    }
    else if (e.code === 'Space' || e.code === 'Enter') buyShopItem();
    else if (e.code === 'Escape'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 2; }
  } else if (game.state === 'missions'){
    if (e.code === 'ArrowUp' || e.code === 'KeyW'){ 
      sfxMenuHover();
      game.missionSelection = (game.missionSelection - 1 + MISSIONS.length) % MISSIONS.length;
    }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS'){ 
      sfxMenuHover();
      game.missionSelection = (game.missionSelection + 1) % MISSIONS.length;
    }
    else if (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter'){ 
      game.state = 'menu'; game.menuTime = 0; game.menuSelection = 3;
    }
  } else if (game.state === 'levels'){
    if (e.code === 'ArrowUp' || e.code === 'KeyW'){ 
      sfxMenuHover();
      game.levelSelection = (game.levelSelection - 1 + game.levels.length) % game.levels.length;
    }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS'){ 
      sfxMenuHover();
      game.levelSelection = (game.levelSelection + 1) % game.levels.length;
    }
    else if (e.code === 'Space' || e.code === 'Enter'){
      if (game.levelSelection < save.unlockedLevels){
        sfxMenuSelect();
        startLevel(game.levelSelection);
      } else {
        beep(180, 0.2, 'sawtooth', 0.06);
      }
    }
    else if (e.code === 'Escape'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 4; }
  } else if (game.state === 'controls'){
    const actions = ['left', 'right', 'jump', 'attack', 'pause', 'inventory'];
    if (game.remapAction === null){
      if (e.code === 'ArrowDown' || e.code === 'KeyS'){
        window._controlSel = ((window._controlSel || 0) + 1) % actions.length;
        sfxMenuHover();
      } else if (e.code === 'ArrowUp' || e.code === 'KeyW'){
        window._controlSel = ((window._controlSel || 0) - 1 + actions.length) % actions.length;
        sfxMenuHover();
      } else if (e.code === 'Space' || e.code === 'Enter'){
        game.remapAction = actions[window._controlSel || 0];
      } else if (e.code === 'Escape'){
        game.state = 'menu'; game.menuTime = 0; game.menuSelection = 5;
      }
    }
  } else if (game.state === 'howto' || game.state === 'credits'){
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape'){
      game.state = 'menu'; game.menuTime = 0;
    }
  } else if (game.state === 'playing'){
    if (e.code === 'KeyP' || e.code === 'Escape'){ game.state = 'paused'; }
    if (controls.inventory.includes(e.code)){ 
      game.state = 'inventory'; game.menuTime = 0;
    }
  } else if (game.state === 'paused'){
    if (e.code === 'KeyP'){ game.state = 'playing'; }
    else if (e.code === 'Escape'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0; }
    else if (controls.inventory.includes(e.code)){ game.state = 'inventory'; game.menuTime = 0; }
  } else if (game.state === 'gameover'){
    if (e.code === 'Space' || e.code === 'Enter'){ 
      if (game.lastCheckpoint) continueFromCheckpoint();
      else startGame();
    }
    else if (e.code === 'Escape'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0; }
  } else if (game.state === 'win'){
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape'){
      game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0;
    }
  }
});

// Listener especial: si estamos remapeando 'attack' y se hace click
// NOTA: los clicks en menús ya están gestionados por el listener del canvas
// Solo capturamos aquí el click durante el remapeo de ATACAR
document.addEventListener('mousedown', (e) => {
  if (game.state === 'controls' && game.remapAction === 'attack'){
    e.preventDefault();
    e.stopPropagation();
    // Convertir botón del ratón a código
    let code = null;
    if (e.button === 0) code = 'Mouse0';
    else if (e.button === 1) code = 'Mouse1';
    else if (e.button === 2) code = 'Mouse2';
    if (code){
      controls[game.remapAction] = [code];
      saveControls();
      game.remapAction = null;
      sfxCheckpointSound();
    }
    return;
  }
}, true); // capture: true para que se ejecute antes

canvas.addEventListener('touchstart', e => {
  initAudio();
  if (game.state === 'intro'){ game.state = 'logo'; game.time = 0; if (actx) startMusic(); }
  else if (game.state === 'logo'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0; if (actx) startMusic(); }
  else if (game.state === 'menu'){ menuSelect(); }
  else if (game.state === 'shop'){ buyShopItem(); }
  else if (game.state === 'inventory' || game.state === 'howto' || game.state === 'credits' || game.state === 'missions' || game.state === 'levels' || game.state === 'controls'){ 
    game.state = 'menu'; game.menuTime = 0; 
  }
  else if (game.state === 'gameover'){ 
    if (game.lastCheckpoint) continueFromCheckpoint();
    else startGame();
  }
  else if (game.state === 'win'){ game.state = 'menu'; game.menuTime = 0; game.menuSelection = 0; }
});

loadLevel(0);
game.state = 'intro';
game.time = 0;
requestAnimationFrame(loop);
</script>
